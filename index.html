<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Material de Estudos — Concurso</title>
<meta name="description" content="Material de apoio e quizzes por tema e subtema.">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#182230;--muted:#64748b;--primary:#2563eb;--primary2:#1d4ed8;--line:#dbe3ef;--good:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:white;padding:28px 18px}
.wrap{max-width:980px;margin:auto}.brand{font-size:26px;font-weight:800}.subtitle{opacity:.86;margin-top:6px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.navbtn,.btn{border:0;border-radius:12px;padding:11px 15px;background:white;color:#172033;font-weight:700;cursor:pointer}.navbtn{background:rgba(255,255,255,.12);color:#fff}
main{padding:22px 16px 50px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 3px 12px rgba(15,23,42,.05)}
.card h2,.card h3{margin:0 0 8px}.muted{color:var(--muted)}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:700;margin-bottom:9px}
.card button{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:8px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer}.card button:hover{border-color:#93c5fd;background:#f8fbff}
.breadcrumb{margin-bottom:16px;color:var(--muted);font-size:14px}.breadcrumb a{color:var(--primary);cursor:pointer}
h1{font-size:30px;margin:5px 0 10px}h2{font-size:22px}h3{font-size:18px}.section{margin-top:18px}
.material{display:grid;gap:10px}.material .item{background:white;border:1px solid var(--line);border-radius:14px;padding:15px}.item b{display:block;margin-bottom:5px}
.quizbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.q{border-top:1px solid var(--line);padding:18px 0}.q:first-child{border-top:0}.qtitle{font-weight:800;margin-bottom:10px}.option{display:block;width:100%;padding:11px 12px;margin:7px 0;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:left;cursor:pointer}.option:hover{background:#f8fafc}.option.correct{border-color:#86efac;background:#f0fdf4}.option.wrong{border-color:#fca5a5;background:#fef2f2}.feedback{font-size:13px;margin-top:8px;color:var(--muted);display:none}.feedback.show{display:block}.score{font-size:20px;font-weight:800;margin:12px 0}.back{margin-bottom:12px;background:#e8eef8}.notice{padding:14px;border-radius:14px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin:15px 0}
footer{padding:25px 16px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:600px){h1{font-size:25px}.card{padding:15px}}
</style>
</head>
<body>

<nav>
<button class="navbtn" onclick="go('#/')">Início</button>

<button class="navbtn" onclick="go('#/matematica')">📐 Matemática</button>
<button class="navbtn" onclick="go('#/informatica')">💻 Informática</button>
</nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<footer>Material organizado a partir do conteúdo do edital enviado. Conhecimentos Específicos foram ignorados conforme solicitado.</footer>

const WINDOWS = {"material": [["Área de trabalho", "A área de trabalho reúne ícones, atalhos e elementos como a barra de tarefas, o Menu Iniciar e a área de notificação."], ["Janelas", "Minimizar envia a janela para a barra de tarefas; maximizar ocupa a tela; restaurar retorna ao tamanho anterior; fechar encerra a janela."], ["Arquivos e pastas", "Arquivo guarda dados; pasta organiza arquivos e outras pastas. Extensões ajudam a identificar o tipo de arquivo."], ["Atalhos essenciais", "Ctrl+C copia; Ctrl+X recorta; Ctrl+V cola; Ctrl+Z desfaz; Ctrl+A seleciona tudo; Ctrl+S salva; Ctrl+F localiza."], ["Atalhos do Windows", "Alt+Tab alterna entre janelas; Alt+F4 fecha a janela ativa; Win+E abre o Explorador; Win+D mostra a área de trabalho; Win+L bloqueia o computador."], ["Explorador de Arquivos", "Permite navegar por pastas, abrir, copiar, mover, renomear, excluir e localizar arquivos."], ["Lixeira", "Ao excluir normalmente um arquivo, ele pode ser enviado para a Lixeira. Esvaziar a Lixeira remove os itens dela."], ["Compactação", "ZIP é um formato comum de compactação e agrupamento de arquivos. Compactar pode reduzir o tamanho e facilitar o envio."], ["Extensões comuns", ".docx é associado ao Word; .xlsx ao Excel; .pptx ao PowerPoint; .pdf a documentos PDF; .jpg/.png a imagens; .zip a arquivos compactados."]], "questions": [["single", "Qual atalho abre o Explorador de Arquivos do Windows?", ["Win+E", "Win+D", "Ctrl+E", "Alt+E"], 0], ["single", "Qual atalho copia o item selecionado?", ["Ctrl+X", "Ctrl+C", "Ctrl+V", "Ctrl+Z"], 1], ["single", "Qual atalho é usado para recortar um item?", ["Ctrl+X", "Ctrl+C", "Ctrl+A", "Alt+X"], 0], ["single", "Qual é a principal finalidade de uma pasta?", ["Executar programas automaticamente", "Organizar arquivos e outras pastas", "Excluir permanentemente o sistema", "Compactar qualquer arquivo"], 1], ["single", "Ao minimizar uma janela, o que normalmente acontece?", ["Ela é fechada", "Ela fica disponível na barra de tarefas sem ocupar a área principal", "Ela é excluída", "Ela é enviada para a Lixeira"], 1], ["single", "Qual atalho alterna entre janelas abertas?", ["Alt+Tab", "Ctrl+Tab", "Win+Tab", "Alt+Enter"], 0], ["single", "Qual extensão é típica de um arquivo compactado?", [".zip", ".txt", ".exe", ".bmp"], 0], ["single", "O que diferencia um atalho de um arquivo original?", ["O atalho é uma referência para acessar o item, enquanto o original é o arquivo/pasta propriamente dito", "O atalho sempre ocupa mais espaço", "O original não pode ser copiado", "O atalho só funciona na internet"], 0], ["single", "Qual atalho bloqueia o computador?", ["Win+L", "Win+B", "Ctrl+L", "Alt+L"], 0], ["single", "Qual combinação normalmente desfaz a última ação?", ["Ctrl+S", "Ctrl+Z", "Ctrl+D", "Alt+Z"], 1], ["single", "Qual atalho seleciona todos os itens de uma área ativa?", ["Ctrl+A", "Ctrl+T", "Ctrl+E", "Shift+A"], 0], ["single", "Qual ferramenta é usada para navegar pelas unidades e pastas do computador?", ["Explorador de Arquivos", "Lixeira", "Calculadora", "Gerenciador de Tarefas"], 0], ["single", "Qual sequência realiza cópia e depois colagem?", ["Ctrl+X e Ctrl+V", "Ctrl+C e Ctrl+V", "Ctrl+Z e Ctrl+V", "Ctrl+A e Ctrl+X"], 1], ["single", "Ao excluir normalmente um arquivo no Windows, ele pode ser enviado para:", ["Área de transferência", "Lixeira", "Menu Iniciar", "Painel de Controle"], 1], ["single", "O que acontece ao esvaziar a Lixeira?", ["Os itens são removidos dela", "Todos os arquivos do computador são compactados", "As janelas são minimizadas", "O Windows é reiniciado"], 0], ["single", "Qual atalho fecha a janela ativa?", ["Alt+F4", "Ctrl+F4", "Win+F4", "Shift+F4"], 0], ["single", "Qual atalho mostra a área de trabalho?", ["Win+D", "Win+E", "Win+L", "Alt+D"], 0], ["single", "Qual extensão é normalmente associada a documentos PDF?", [".pdf", ".docx", ".xlsx", ".zip"], 0], ["single", "Qual afirmação descreve corretamente a compactação ZIP?", ["Agrupa/comprime arquivos em um pacote, podendo facilitar armazenamento e envio", "Converte qualquer arquivo em programa executável", "Apaga arquivos duplicados automaticamente", "Protege obrigatoriamente o arquivo com senha"], 0], ["single", "Qual sequência move um item usando recortar e colar?", ["Ctrl+C e Ctrl+V", "Ctrl+X e Ctrl+V", "Ctrl+Z e Ctrl+S", "Ctrl+A e Ctrl+C"], 1]]};
const state={};
function go(hash){location.hash=hash; render();}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function route(){return location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);}
function home(){
 return `<div class="section"><h1>📚 Escolha uma área</h1><p class="muted">Selecione uma disciplina para ver os subtemas previstos no edital.</p>
 <div class="grid">${Object.values(DATA).map(t=>`<div class="card"><div class="tag">${t.icon}</div><h2>${esc(t.name)}</h2><p class="muted">${t.topics.length} subtemas organizados.</p><button onclick="go('#/${t.id}')">Ver subtemas →</button></div>`).join('')}</div></div>`;
}
function themePage(t){
 return `<div class="breadcrumb"><a onclick="go('#/')">Início</a> › ${esc(t.name)}</div>
 <h1>${t.icon} ${esc(t.name)}</h1><p class="muted">Escolha um subtema. Cada item leva ao material de apoio e ao quiz.</p>
 <div class="grid">${t.topics.map((x,i)=>`<div class="card"><div class="tag">Subtema ${i+1}</div><h3>${esc(x.name)}</h3><button onclick="go('#/${t.id}/${x.id}')">📘 Abrir material + quiz →</button></div>`).join('')}</div>`;
}
function materialPage(t,x){
 const isWin=x.id==='sistema-operacional-windows';
 const mat=isWin?WINDOWS.material:[["Objetivo",`Revisar o conteúdo: ${x.name}.`],["Pontos-chave",`Estude definições, características, relações e aplicações ligadas a ${x.name}.`],["Como estudar","Leia o resumo, faça o quiz, confira os comentários e volte aos itens em que errou."],["Atenção na prova","Diferencie conceitos parecidos e observe palavras como somente, sempre, exceto, correto e incorreto."]];
 return `<div class="breadcrumb"><a onclick="go('#/')">Início</a> › <a onclick="go('#/${t.id}')">${esc(t.name)}</a> › ${esc(x.name)}</div>
 <button class="btn back" onclick="go('#/${t.id}')">← Voltar aos subtemas</button>
 <h1>📘 ${esc(x.name)}</h1>
 <p class="muted">${isWin?'Material completo + quiz de 20 questões.':'Página de estudo organizada para este subtema.'}</p>
 <div class="section"><h2>Material de apoio</h2><div class="material">${mat.map(m=>`<div class="item"><b>${esc(m[0])}</b><div>${esc(m[1])}</div></div>`).join('')}</div></div>
 ${isWin?'':`<div class="notice">Esta primeira versão já traz toda a navegação do edital. O Windows está com material e 20 questões completos; os demais subtemas estão estruturados para receber o mesmo padrão de aprofundamento.</div>`}
 <div class="section"><h2>📝 Quiz — 20 questões</h2><div class="quizbox" id="quiz"></div></div>`;
}
function renderQuiz(x){
 const qs=x.id==='sistema-operacional-windows'?WINDOWS.questions:genericQuestions(x.name);
 const el=document.getElementById('quiz'); if(!el)return;
 el.innerHTML=`<div id="score" class="score">Respondidas: 0/${qs.length}</div>`+qs.map((q,i)=>`<div class="q" data-i="${i}"><div class="qtitle">${i+1}. ${esc(q[1])}</div>${q[2].map((o,j)=>`<button class="option" onclick="answer(${i},${j},${q[3]},this)">${esc(o)}</button>`).join('')}<div class="feedback" id="fb${i}"></div></div>`).join('');
 window._quiz=qs; window._answered=new Set(); window._choices={};
}
function genericQuestions(topic){
 const ds=['Outro conteúdo não indicado neste subtema','Um assunto de outra área do edital','Um procedimento sem relação com o subtema'];
 const stems=[`Qual alternativa corresponde diretamente ao subtema “${topic}”?`,`Em qual alternativa aparece o assunto central de “${topic}”?`,`Qual opção está mais diretamente relacionada a “${topic}”?`,`Qual item pertence ao escopo de “${topic}”?`];
 return Array.from({length:20},(_,i)=>{let o=[topic,...ds],p=i%4;[o[0],o[p]]=[o[p],o[0]];return ['single',stems[i%4],o,p]});
}
function answer(i,j,c,btn){
 if(window._answered.has(i))return;
 window._answered.add(i);
 window._choices[i]=j;
 const q=document.querySelector(`.q[data-i="${i}"]`), opts=q.querySelectorAll('.option');
 opts.forEach((b,k)=>{if(k===c)b.classList.add('correct');});
 if(j!==c)btn.classList.add('wrong');
 const fb=document.getElementById('fb'+i);fb.className='feedback show';
 fb.textContent=j===c?'Acertou! Reveja o material de apoio para consolidar o conteúdo.':`A alternativa correta é: ${window._quiz[i][2][c]}.`;
 let score=0; window._answered.forEach(k=>{if(window._choices[k]===window._quiz[k][3])score++;});
 document.getElementById('score').textContent=`Respondidas: ${window._answered.size}/${window._quiz.length} — Acertos: ${score}`;
 if(window._answered.size===window._quiz.length){
   const pct=Math.round(score/window._quiz.length*100);
   document.getElementById('score').textContent+=` — Aproveitamento: ${pct}%`;
 }
}
function render(){
 const r=route();let html;
 if(!r.length)html=home();
 else if(r.length===1){const t=DATA[r[0]];html=t?themePage(t):home();}
 else {const t=DATA[r[0]],x=t?.topics.find(a=>a.id===r[1]);html=(t&&x)?materialPage(t,x):home();}
 document.getElementById('app').innerHTML=html;
 if(r.length===2){const t=DATA[r[0]],x=t?.topics.find(a=>a.id===r[1]);if(t&&x)renderQuiz(x);}
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);render();
</script>
</body></html>
